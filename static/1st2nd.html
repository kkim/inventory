<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>1층 + 2층 통합 3D 렌더링 (공통 원점: 북서 내측 모서리)</title>
  <style>
    body { margin: 0; overflow: hidden; background: #18191c; font-family: sans-serif; }
    canvas { width: 100vw; height: 100vh; display: block; }
    #info {
      position: absolute; top: 16px; left: 16px; color: #f0f0f0;
      background: rgba(20,20,22,0.85); padding: 14px 20px; border-radius: 8px;
      font-size: 13px; line-height: 1.6; pointer-events: none;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }
    #layers {
      position: absolute; top: 16px; right: 16px; color: #f0f0f0;
      background: rgba(20,20,22,0.85); padding: 14px 20px; border-radius: 8px;
      font-size: 13px; line-height: 1.9; user-select: none;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }
    #layers label { display: block; cursor: pointer; }
  </style>
</head>
<body>
  <div id="info">
    <strong>1층 + 2층 통합 렌더링</strong><br>
    &bull; 마우스 좌클릭: 회전 | 우클릭: 이동 | 휠: 줌<br>
    &bull; 기준: 2층 / 공통 원점: 북서 내측 모서리 (X=-108, Z=0)
  </div>
  <div id="layers">
    <label><input type="checkbox" data-floor="f1" checked> 1st floor</label>
    <label><input type="checkbox" data-floor="f2" checked> 2nd floor</label>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x18191c);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 8000);
    camera.position.set(120, 380, 640);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(140, -40, 150);

    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    pmremGenerator.compileEquirectangularShader();
    const envScene = new THREE.Scene();
    envScene.background = new THREE.Color(0xeef2f7);
    const eL1 = new THREE.DirectionalLight(0xffffff, 2.5);
    eL1.position.set(1, 2, 1);
    envScene.add(eL1);
    const eL2 = new THREE.DirectionalLight(0xdbe5f0, 1.5);
    eL2.position.set(-1, 1, -1);
    envScene.add(eL2);
    scene.environment = pmremGenerator.fromScene(envScene).texture;

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
    scene.add(ambientLight);

    const mainLight = new THREE.DirectionalLight(0xfff5ea, 2.0);
    mainLight.position.set(140, 320, 180);
    mainLight.castShadow = true;
    mainLight.shadow.mapSize.width = 2048;
    mainLight.shadow.mapSize.height = 2048;
    mainLight.shadow.bias = -0.0004;
    scene.add(mainLight);

    const fillLight = new THREE.DirectionalLight(0xd5e3f5, 0.8);
    fillLight.position.set(-90, 160, -40);
    scene.add(fillLight);

    const bathLight = new THREE.PointLight(0xffffff, 0.9, 260);
    bathLight.position.set(185, 85, 70);
    scene.add(bathLight);

    const stairLight1 = new THREE.PointLight(0xffeedd, 1.5, 260);
    stairLight1.position.set(175, 10, 238);
    scene.add(stairLight1);

    const stairLight2 = new THREE.PointLight(0xffeedd, 1.2, 220);
    stairLight2.position.set(205, -20, 278);
    scene.add(stairLight2);

    const fireLight = new THREE.PointLight(0xff7722, 1.8, 90);
    fireLight.position.set(7, 22, 276);
    scene.add(fireLight);

    // ==========================================
    // 층/종류별 그룹 (토글용)
    //   w = 벽/구조(바닥, 계단, 문, 창 포함), f = 가구/설비
    // ==========================================
    // 공통 원점: 북서 내측 모서리.
    //  - 2층(기준): 내측 모서리 = (-108, 0)
    //  - 1층: 내측 모서리 = (-103, 5) -> (-5, -5) 이동하여 일치
    const FLOOR_DROP = 92;  // 1층 바닥 높이 = 2층 바닥 - 92" (벽 90" + 슬래브)
    const F1_OFFSET = new THREE.Vector3(-5, -FLOOR_DROP, -5);

    const groups = { f1w: new THREE.Group(), f1f: new THREE.Group(), f2w: new THREE.Group(), f2f: new THREE.Group() };
    groups.f1w.position.copy(F1_OFFSET);
    groups.f1f.position.copy(F1_OFFSET);
    Object.values(groups).forEach(g => scene.add(g));

    let curFloor = 'f2';
    let curKind = 'w';
    function addObj(obj) { groups[curFloor + curKind].add(obj); }

    // ==========================================
    // 텍스처 생성기
    // ==========================================
    function createGraniteTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024; canvas.height = 1024;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#232528';
      ctx.fillRect(0, 0, 1024, 1024);

      const speckleColors = ['#151618', '#383c42', '#4b525d', '#717b8a', '#abb2bf', '#1a1b1d'];
      for (let i = 0; i < 45000; i++) {
        const x = Math.random() * 1024;
        const y = Math.random() * 1024;
        ctx.fillStyle = speckleColors[Math.floor(Math.random() * speckleColors.length)];
        ctx.beginPath();
        ctx.arc(x, y, Math.random() * 2.2 + 0.6, 0, Math.PI * 2);
        ctx.fill();
      }
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(2, 2);
      return tex;
    }

    function createWoodCabinetTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024; canvas.height = 1024;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#9e7552';
      ctx.fillRect(0, 0, 1024, 1024);

      ctx.fillStyle = '#7a5438';
      for (let i = 0; i < 350; i++) {
        const y = Math.random() * 1024;
        const h = Math.random() * 3 + 1;
        ctx.globalAlpha = 0.15;
        ctx.fillRect(0, y, 1024, h);
      }
      ctx.globalAlpha = 1.0;
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(1.5, 1.5);
      return tex;
    }

    function createDarkWoodFloorTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024; canvas.height = 1024;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#4a3728';
      ctx.fillRect(0, 0, 1024, 1024);

      ctx.strokeStyle = '#2b1f16';
      ctx.lineWidth = 3;
      const plankH = 56;
      for (let y = 0; y < 1024; y += plankH) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(1024, y); ctx.stroke();
        const offset = (y / plankH) % 2 === 0 ? 0 : 128;
        for (let x = offset; x < 1024; x += 256) {
          ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + plankH); ctx.stroke();
        }
      }
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(6.0, 4.5);
      return tex;
    }

    function createTileTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512; canvas.height = 512;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#dcdedf';
      ctx.fillRect(0, 0, 512, 512);
      ctx.strokeStyle = '#9ca0a4';
      ctx.lineWidth = 4;
      const size = 128;
      for (let x = 0; x <= 512; x += size) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 512); ctx.stroke();
      }
      for (let y = 0; y <= 512; y += size) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(512, y); ctx.stroke();
      }
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(4, 6);
      return tex;
    }

    function createRugTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512; canvas.height = 512;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#dfdcd5';
      ctx.fillRect(0, 0, 512, 512);
      ctx.fillStyle = '#cac6bc';
      for (let i = 0; i < 8000; i++) {
        const x = Math.random() * 512;
        const y = Math.random() * 512;
        ctx.fillRect(x, y, 2, 2);
      }
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(4, 4);
      return tex;
    }

    function createBrickTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512; canvas.height = 512;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#944b36';
      ctx.fillRect(0, 0, 512, 512);

      ctx.strokeStyle = '#dfdad3';
      ctx.lineWidth = 4;
      const rowH = 32;
      const colW = 64;
      for (let y = 0; y <= 512; y += rowH) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(512, y); ctx.stroke();
        const offset = (y / rowH) % 2 === 0 ? 0 : colW / 2;
        for (let x = offset; x <= 512; x += colW) {
          ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + rowH); ctx.stroke();
        }
      }
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(3, 4);
      return tex;
    }

    // 재질 정의
    const floorMat = new THREE.MeshStandardMaterial({ map: createDarkWoodFloorTexture(), roughness: 0.45 });
    const bathTileMat = new THREE.MeshStandardMaterial({ map: createTileTexture(), roughness: 0.25 });
    const rugMat = new THREE.MeshStandardMaterial({ map: createRugTexture(), roughness: 0.95 });
    const wallMat = new THREE.MeshPhysicalMaterial({ color: 0xf5f8fa, transmission: 0.85, opacity: 0.88, transparent: true, roughness: 0.35, ior: 1.45 });
    const woodCabMat = new THREE.MeshStandardMaterial({ map: createWoodCabinetTexture(), roughness: 0.35 });
    const brickMat = new THREE.MeshStandardMaterial({ map: createBrickTexture(), roughness: 0.85 });
    const gapMat = new THREE.MeshStandardMaterial({ color: 0x1f1610, roughness: 0.9 });
    const toeKickMat = new THREE.MeshStandardMaterial({ color: 0x141210, roughness: 0.8 });

    const graniteCounterMat = new THREE.MeshStandardMaterial({
      map: createGraniteTexture(),
      roughness: 0.18,
      metalness: 0.1
    });

    const brushedSSMat = new THREE.MeshStandardMaterial({
      color: 0xeeeeee,
      metalness: 0.88,
      roughness: 0.25
    });

    const darkSSMat = new THREE.MeshStandardMaterial({
      color: 0x22252a,
      metalness: 0.85,
      roughness: 0.2
    });

    const translucentWallMat = new THREE.MeshPhysicalMaterial({
      color: 0xf5f8fa,
      transmission: 0.85,
      opacity: 0.88,
      transparent: true,
      roughness: 0.35,
      ior: 1.45,
      metalness: 0.05
    });

    const couchFabricMat = new THREE.MeshStandardMaterial({ color: 0x828487, roughness: 0.85 });
    const cushionFabricMat = new THREE.MeshStandardMaterial({ color: 0x9a9ca0, roughness: 0.8 });
    const couchLegMat = new THREE.MeshStandardMaterial({ color: 0x1c1b1a, roughness: 0.5 });

    const tableWoodMat = new THREE.MeshStandardMaterial({ map: createWoodCabinetTexture(), roughness: 0.3 });
    const chairFrameMat = new THREE.MeshStandardMaterial({ color: 0x241d18, roughness: 0.5 });
    const chairCushionMat = new THREE.MeshStandardMaterial({ color: 0xd8d4cb, roughness: 0.9 });

    const ceramicWhiteMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.15 });
    const tubInnerMat = new THREE.MeshStandardMaterial({ color: 0xedf2f4, roughness: 0.1 });
    const mirrorMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.0, metalness: 0.98 });
    const doorMat = new THREE.MeshStandardMaterial({ color: 0xc8c3bb, roughness: 0.6 });
    const entryDoorMat = new THREE.MeshStandardMaterial({ color: 0x2c3539, roughness: 0.4 });

    const tvScreenMat = new THREE.MeshStandardMaterial({ color: 0x05070a, roughness: 0.1, metalness: 0.9 });
    const tvBezelMat = new THREE.MeshStandardMaterial({ color: 0x151618, roughness: 0.4 });

    const pianoBodyMat = new THREE.MeshStandardMaterial({ color: 0x181819, roughness: 0.35, metalness: 0.1 });
    const pianoKeyWhiteMat = new THREE.MeshStandardMaterial({ color: 0xf5f4f0, roughness: 0.15 });
    const pianoKeyBlackMat = new THREE.MeshStandardMaterial({ color: 0x0a0a0b, roughness: 0.2 });
    const brassMat = new THREE.MeshStandardMaterial({ color: 0xd4af37, metalness: 0.9, roughness: 0.2 });
    const cardboardMat = new THREE.MeshStandardMaterial({ color: 0xb58a58, roughness: 0.8 });

    const cooktopGlass = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.1, metalness: 0.95 });
    const burnerMat = new THREE.MeshStandardMaterial({ color: 0x0a0a0a, roughness: 0.7, metalness: 0.2 });
    const glassMat = new THREE.MeshPhysicalMaterial({ color: 0xa0d0ea, transparent: true, opacity: 0.35, roughness: 0.05, transmission: 0.9 });
    const fireGlassMat = new THREE.MeshPhysicalMaterial({ color: 0xffffff, transparent: true, opacity: 0.3, roughness: 0.05, transmission: 0.95 });
    const showerGlassMat = new THREE.MeshPhysicalMaterial({ color: 0xffffff, transparent: true, opacity: 0.45, roughness: 0.1, transmission: 0.9 });
    const windowFrameMat = new THREE.MeshStandardMaterial({ color: 0x242424, roughness: 0.4 });


    // ==========================================
    // 2층 (기준)
    // ==========================================
    {
    curFloor = 'f2'; curKind = 'w';
    function createBox(w, h, d, x, y, z, mat, shadow = true) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
      mesh.position.set(x + w / 2, y + h / 2, z + d / 2);
      mesh.castShadow = shadow;
      mesh.receiveShadow = shadow;
      addObj(mesh);
      return mesh;
    }

    function addWallAlignedHandle(x, y, z, facing = 'back', isVertical = false, length = 6) {
      const handleMat = brushedSSMat;
      const thick = 0.4;
      const standoff = 0.8;
      const group = new THREE.Group();

      let barGeom, p1Geom, p2Geom;
      let barPos, p1Pos, p2Pos;

      if (facing === 'back') {
        if (isVertical) {
          barGeom = new THREE.BoxGeometry(thick, length, thick);
          barPos = [0, 0, standoff];
          p1Geom = new THREE.BoxGeometry(thick, thick, standoff);
          p1Pos = [0, -(length / 2 - thick), standoff / 2];
          p2Geom = new THREE.BoxGeometry(thick, thick, standoff);
          p2Pos = [0, (length / 2 - thick), standoff / 2];
        } else {
          barGeom = new THREE.BoxGeometry(length, thick, thick);
          barPos = [0, 0, standoff];
          p1Geom = new THREE.BoxGeometry(thick, thick, standoff);
          p1Pos = [-(length / 2 - thick), 0, standoff / 2];
          p2Geom = new THREE.BoxGeometry(thick, thick, standoff);
          p2Pos = [(length / 2 - thick), 0, standoff / 2];
        }
      } else if (facing === 'front') {
        if (isVertical) {
          barGeom = new THREE.BoxGeometry(thick, length, thick);
          barPos = [0, 0, -standoff];
          p1Geom = new THREE.BoxGeometry(thick, thick, standoff);
          p1Pos = [0, -(length / 2 - thick), -standoff / 2];
          p2Geom = new THREE.BoxGeometry(thick, thick, standoff);
          p2Pos = [0, (length / 2 - thick), -standoff / 2];
        } else {
          barGeom = new THREE.BoxGeometry(length, thick, thick);
          barPos = [0, 0, -standoff];
          p1Geom = new THREE.BoxGeometry(thick, thick, standoff);
          p1Pos = [-(length / 2 - thick), 0, -standoff / 2];
          p2Geom = new THREE.BoxGeometry(thick, thick, standoff);
          p2Pos = [(length / 2 - thick), 0, -standoff / 2];
        }
      } else if (facing === 'right') {
        if (isVertical) {
          barGeom = new THREE.BoxGeometry(thick, length, thick);
          barPos = [-standoff, 0, 0];
          p1Geom = new THREE.BoxGeometry(standoff, thick, thick);
          p1Pos = [-standoff / 2, -(length / 2 - thick), 0];
          p2Geom = new THREE.BoxGeometry(standoff, thick, thick);
          p2Pos = [-standoff / 2, (length / 2 - thick), 0];
        } else {
          barGeom = new THREE.BoxGeometry(thick, thick, length);
          barPos = [-standoff, 0, 0];
          p1Geom = new THREE.BoxGeometry(standoff, thick, thick);
          p1Pos = [-standoff / 2, 0, -(length / 2 - thick)];
          p2Geom = new THREE.BoxGeometry(standoff, thick, thick);
          p2Pos = [-standoff / 2, 0, (length / 2 - thick)];
        }
      }

      const bar = new THREE.Mesh(barGeom, handleMat);
      bar.position.set(...barPos);
      bar.castShadow = true;
      group.add(bar);

      const p1 = new THREE.Mesh(p1Geom, handleMat);
      p1.position.set(...p1Pos);
      group.add(p1);

      const p2 = new THREE.Mesh(p2Geom, handleMat);
      p2.position.set(...p2Pos);
      group.add(p2);

      group.position.set(x, y, z);
      addObj(group);
    }

    // ==========================================
    // 바닥 구획 (계단실 개구부 보존)
    // ==========================================
    function createFloorPlane(w, d, x, z, mat) {
      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, d), mat);
      mesh.rotation.x = -Math.PI / 2;
      mesh.position.set(x + w / 2, 0, z + d / 2);
      mesh.receiveShadow = true;
      addObj(mesh);
      return mesh;
    }

    curKind = 'w';
    createFloorPlane(255, 288, -108, 0, floorMat);
    createFloorPlane(62, 144, 151, 0, bathTileMat);
    createFloorPlane(64, 62, 147, 144, floorMat);
    createFloorPlane(190, 180, 213, 0, floorMat);
    createFloorPlane(168, 108, 235, 180, floorMat);

    // ==========================================
    // 외벽 구조
    // ==========================================
    const backWall = new THREE.Mesh(new THREE.BoxGeometry(511, 108, 2), wallMat);
    backWall.position.set(147.5, 54, -1);
    addObj(backWall);

    const kitchenEastWall = new THREE.Mesh(new THREE.BoxGeometry(2, 108, 144), wallMat);
    kitchenEastWall.position.set(151, 54, 72);
    addObj(kitchenEastWall);

    const farEastWall = new THREE.Mesh(new THREE.BoxGeometry(2, 108, 288), wallMat);
    farEastWall.position.set(403, 54, 144);
    addObj(farEastWall);

    // ==========================================
    // 화장실 내부 설비 & 욕조 & 동향 변기
    // ==========================================
    createBox(16, 108, 2, 151, 0, 144, wallMat);
    createBox(32, 28, 2, 167, 80, 144, wallMat);
    createBox(14, 108, 2, 199, 0, 144, wallMat);

    const bathDoor = new THREE.Mesh(new THREE.BoxGeometry(30, 80, 1.5), doorMat);
    bathDoor.position.set(182, 40, 145);
    bathDoor.rotation.y = -0.4;
    addObj(bathDoor);
    createBox(1.5, 5, 2, 192, 38, 144, brushedSSMat);

    curKind = 'f';
    const tubX = 153.2;
    const tubW = 59.6;
    const tubZ = 1.0;
    const tubD = 31.0;
    const tubH = 20.0;
    const rimT = 3.5;

    createBox(tubW, tubH, 3.5, tubX, 0, tubZ + tubD - 3.5, ceramicWhiteMat);
    createBox(rimT, tubH, tubD - 3.5, tubX, 0, tubZ, ceramicWhiteMat);
    createBox(rimT, tubH, tubD - 3.5, tubX + tubW - rimT, 0, tubZ, ceramicWhiteMat);
    createBox(tubW - rimT * 2, rimT, 3.0, tubX + rimT, tubH - rimT, tubZ, ceramicWhiteMat);

    createBox(tubW - rimT * 2, 2.0, tubD - rimT - 3.0, tubX + rimT, 0.5, tubZ + 1.0, tubInnerMat);
    createBox(tubW - rimT * 2, tubH - rimT, 1.5, tubX + rimT, 0.5, tubZ + 1.0, tubInnerMat);
    createBox(tubW - rimT * 2, tubH - rimT, 1.5, tubX + rimT, 0.5, tubZ + tubD - rimT - 1.5, tubInnerMat);
    createBox(1.5, tubH - rimT, tubD - rimT - 3.0, tubX + rimT, 0.5, tubZ + 1.0, tubInnerMat);
    createBox(1.5, tubH - rimT, tubD - rimT - 3.0, tubX + tubW - rimT - 1.5, 0.5, tubZ + 1.0, tubInnerMat);
    createBox(2, 6, 2, 154, 20, 16, brushedSSMat);

    createBox(8, 28, 18, 153.2, 0, 51, ceramicWhiteMat);
    createBox(20, 16, 14, 161.2, 0, 53, ceramicWhiteMat);
    createBox(1.5, 1.0, 1.5, 158.0, 26, 65, brushedSSMat);

    createBox(22, 32, 48, 153, 0, 90, woodCabMat);
    createBox(23, 1.5, 49, 153, 32, 89.5, graniteCounterMat);
    createBox(16, 6, 22, 156, 31, 103, ceramicWhiteMat);
    createBox(1, 38, 44, 153, 44, 92, mirrorMat);
    createBox(0.2, 32, 0.3, 175.2, 0, 114, gapMat);
    addWallAlignedHandle(175, 22, 102, 'right', false, 8);
    addWallAlignedHandle(175, 22, 126, 'right', false, 12);

    // ==========================================
    // 화장실 동쪽벽 (X=213) 및 침실 1 서쪽벽 (X=245)
    // ==========================================
    curKind = 'w';
    createBox(2, 108, 72, 213, 0, 0, wallMat);

    createBox(32, 108, 2, 213, 0, 72, wallMat);
    createBox(32, 108, 2, 213, 0, 120, wallMat);
    createBox(2, 108, 48, 245, 0, 72, wallMat);
    createBox(2, 6, 2, 243, 70, 96, brushedSSMat);

    const showerDoor = new THREE.Mesh(new THREE.BoxGeometry(0.8, 80, 44), showerGlassMat);
    showerDoor.position.set(213, 40, 96);
    showerDoor.rotation.y = -0.3;
    addObj(showerDoor);
    createBox(0.6, 12, 0.6, 212.5, 38, 104, brushedSSMat);

    createBox(2, 108, 24, 213, 0, 120, wallMat);
    createBox(2, 108, 24, 245, 0, 120, wallMat);
    createBox(32, 28, 2, 213, 80, 144, wallMat);

    const linenDoor = new THREE.Mesh(new THREE.BoxGeometry(30, 80, 1.5), doorMat);
    linenDoor.position.set(229, 40, 145);

        cabin.castShadow = true;
        carGroup.add(cabin);

        // 루프 탑 커버
        const roof = new THREE.Mesh(new THREE.BoxGeometry(cabinLen * 0.9, 2.5, cabinWidth * 0.95), matCarBody);
        roof.position.set(-8, 30 + cabinHeight + 1, 0);
        roof.castShadow = true;
        carGroup.add(roof);

        // 휠 & 타이어 (rotateX(Math.PI / 2)로 회전축을 Z축으로 일치시켜 수직 기립)
        const wheelGeo = new THREE.CylinderGeometry(14, 14, 8, 20);
        wheelGeo.rotateX(Math.PI / 2);

        const wheelRimGeo = new THREE.CylinderGeometry(9, 9, 8.2, 16);
        wheelRimGeo.rotateX(Math.PI / 2);

        const wheelOffsets = [
            { x: carLen * 0.32,  z: -carWidth / 2 - 1 }, // 전륜 좌
            { x: carLen * 0.32,  z: carWidth / 2 + 1 },  // 전륜 우
            { x: -carLen * 0.32, z: -carWidth / 2 - 1 }, // 후륜 좌
            { x: -carLen * 0.32, z: carWidth / 2 + 1 }   // 후륜 우
        ];

        wheelOffsets.forEach(pos => {
            const tire = new THREE.Mesh(wheelGeo, matTire);
            tire.position.set(pos.x, 14, pos.z);
            tire.castShadow = true;
            carGroup.add(tire);

            const rim = new THREE.Mesh(wheelRimGeo, matWheel);
            rim.position.set(pos.x, 14, pos.z);
            carGroup.add(rim);
        });

        // 차고 내 정중앙 주차 (전면이 동쪽 셔터 출구를 향함)
        const garageCenterX = (135 + eastOuterX) / 2;
        const garageCenterZ = 77.5;
        carGroup.position.set(garageCenterX, 0, garageCenterZ);
        addObj(carGroup);

        // ------------------------------------------
        // 남쪽 침실 가구 (1층 로컬 좌표; 실내 X: -103 ~ 98.5, Z: ... ~ 297)
        // ------------------------------------------
        curKind = 'f';
        const bedBox = (w, h, d, x, y, z, mat) => {
            const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
            m.position.set(x + w / 2, y + h / 2, z + d / 2);
            m.castShadow = true;
            m.receiveShadow = true;
            addObj(m);
        };
        const roomWestX = -103, roomSouthZ = 297, roomEastX = 98.5;

        // 킹 침대 76" x 80", 남서 코너, 머리판이 남쪽
        const kingW = 76, kingL = 80;
        const bedX = roomWestX, bedZ = roomSouthZ - kingL;
        bedBox(kingW, 8, kingL, bedX, 4, bedZ, woodCabMat);                         // 프레임
        bedBox(kingW, 10, kingL - 2, bedX, 12, bedZ, chairCushionMat);              // 매트리스
        bedBox(kingW, 3, kingL - 26, bedX, 22, bedZ, couchFabricMat);               // 이불 (발치~중간)
        bedBox(kingW, 48, 4, bedX, 0, roomSouthZ - 4, woodCabMat);                  // 헤드보드 (남쪽)
        for (let p = 0; p < 2; p++) {                                               // 베개
            bedBox(34, 5, 18, bedX + 2 + p * 38, 22, roomSouthZ - 4 - 19, cushionFabricMat);
        }
        bedBox(3, 4, 3, bedX, 0, bedZ, couchLegMat);
        bedBox(3, 4, 3, bedX + kingW - 3, 0, bedZ, couchLegMat);

        // 서랍장: 2열 x 3단, 침대 동쪽 옆, 남쪽 벽
        const drW = 36, drD = 18, drH = 36;
        const drX = bedX + kingW, drZ = roomSouthZ - drD;
        bedBox(drW, drH, drD, drX, 0, drZ, woodCabMat);
        bedBox(drW + 1, 1.5, drD + 1, drX - 0.5, drH, drZ - 0.5, tableWoodMat);     // 상판
        for (let r = 1; r < 3; r++) {                                               // 단 구분선
            bedBox(drW, 0.3, 0.4, drX, r * (drH / 3), drZ - 0.2, gapMat);
        }
        bedBox(0.3, drH, 0.4, drX + drW / 2, 0, drZ - 0.2, gapMat);                 // 열 구분선
        for (let c = 0; c < 2; c++) {
            for (let r = 0; r < 3; r++) {
                bedBox(6, 0.6, 0.6, drX + c * (drW / 2) + drW / 4 - 3, r * (drH / 3) + drH / 6, drZ - 0.6, brushedSSMat);
            }
        }

        // 스탠딩 데스크 60" x 24": 남동 코너 (남쪽 벽 + 동쪽 벽)
        const deskW = 60, deskD = 24, deskH = 42;
        const deskX = roomEastX - deskW, deskZ = roomSouthZ - deskD;
        bedBox(deskW, 1.5, deskD, deskX, deskH - 1.5, deskZ, tableWoodMat);          // 상판
        bedBox(3, deskH - 1.5, deskD - 4, deskX + 4, 0, deskZ + 2, darkSSMat);       // 다리
        bedBox(3, deskH - 1.5, deskD - 4, deskX + deskW - 7, 0, deskZ + 2, darkSSMat);
        bedBox(deskW - 14, 3, 2, deskX + 7, deskH - 5, deskZ + deskD - 6, darkSSMat); // 크로스바

    }

    // ==========================================
    // 표시 토글
    // ==========================================
    document.querySelectorAll('#layers input[data-floor]').forEach(cb => {
      cb.addEventListener('change', () => { groups[cb.dataset.floor + 'w'].visible = groups[cb.dataset.floor + 'f'].visible = cb.checked; });
    });

    // 창 리사이즈
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
